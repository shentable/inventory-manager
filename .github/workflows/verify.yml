name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python -m venv server/.venv && server/.venv/bin/pip install -r server/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium
      - run: cp cloudflare/.dev.vars.example cloudflare/.dev.vars && npm run cf:test && npm run cf:check
      - run: SKIP_ANDROID=1 ./scripts/verify.sh
      - working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

  release-apk:
    if: github.event_name == 'workflow_dispatch'
    needs: application
    runs-on: ubuntu-latest
    env:
      SANDWICH_EASYTIER_NETWORK_NAME: ${{ secrets.SANDWICH_EASYTIER_NETWORK_NAME }}
      SANDWICH_EASYTIER_NETWORK_SECRET: ${{ secrets.SANDWICH_EASYTIER_NETWORK_SECRET }}
      SANDWICH_EASYTIER_PEERS: ${{ secrets.SANDWICH_EASYTIER_PEERS }}
      SANDWICH_DEFAULT_SERVER_URL: ${{ vars.SANDWICH_DEFAULT_SERVER_URL }}
      SANDWICH_RELEASE_STORE_FILE: ${{ runner.temp }}/sandwich-release.jks
      SANDWICH_RELEASE_STORE_PASSWORD: ${{ secrets.SANDWICH_RELEASE_STORE_PASSWORD }}
      SANDWICH_RELEASE_KEY_ALIAS: ${{ secrets.SANDWICH_RELEASE_KEY_ALIAS }}
      SANDWICH_RELEASE_KEY_PASSWORD: ${{ secrets.SANDWICH_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt
      - run: sdkmanager 'ndk;27.2.12479018'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: python -m venv server/.venv && server/.venv/bin/pip install -r server/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Restore signing keystore
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SANDWICH_RELEASE_STORE_BASE64 }}
        run: printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$SANDWICH_RELEASE_STORE_FILE"
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./android/easytier/build-core.sh
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./android/native-server/build-server.sh
      - run: ./scripts/verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sandwich-inventory-pilot
          path: |
            artifacts/sandwich-inventory-pilot.apk
            artifacts/sandwich-inventory-pilot.apk.sha256
            artifacts/easytier-build-metadata.txt
            artifacts/native-server-build-metadata.txt
          if-no-files-found: error
